<!DOCTYPE html>
<html lang="de">
<head>

<style>
:root{
  --bg:#14161a; --panel:#1d2026; --panel2:#262a32; --line:#323741;
  --text:#eef0f3; --muted:#9aa1ad; --accent:#ff8a1f; --accent2:#ffb15c;
  --ok:#3ccf7a; --warn:#f2c94c; --bad:#ff5a5a; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.02em;margin:0}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;padding-top:calc(10px + env(safe-area-inset-top)) !important;padding-left:calc(14px + env(safe-area-inset-left)) !important;padding-right:calc(14px + env(safe-area-inset-right)) !important;z-index:5;background:rgba(20,22,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed";font-weight:700;font-size:21px;text-transform:uppercase}
.logo .lt>span{color:var(--accent)}
.vsel{margin-left:auto;display:flex;gap:6px;align-items:center;min-width:0;flex:1;justify-content:flex-end}
@media(max-width:430px){.logo .lt{display:none}}
.vsel select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;max-width:100%;min-width:0;flex:0 1 auto}
main{padding:14px calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left))}
.backup{background:rgba(255,138,31,.1);border:1px solid rgba(255,138,31,.4);border-radius:var(--radius);padding:12px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:20px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*{min-width:0}
@media(max-width:380px){form .grid2{grid-template-columns:minmax(0,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1205}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#5a2a2a}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.hero{background:linear-gradient(135deg,#262a32,#1b1d22);position:relative;overflow:hidden}
.hero .plate{display:inline-block;background:#f4f4f4;color:#111;border-radius:6px;padding:2px 10px 2px 22px;font-family:"Barlow Condensed";font-weight:700;font-size:20px;position:relative;border:2px solid #111}
.hero .plate:before{content:"D";position:absolute;left:0;top:0;bottom:0;width:16px;background:#0b3d91;color:#fff;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.hero .big{font-family:"Barlow Condensed";font-size:30px;font-weight:700;line-height:1.05}
.km{font-family:"Barlow Condensed";font-size:34px;font-weight:700;color:var(--accent2)}
.stat{background:var(--panel2);border-radius:11px;padding:10px}
.stat b{display:block;font-family:"Barlow Condensed";font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.list>.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.list>.item:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:0 0 38px;font-size:18px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2)}
.pill.ok{background:rgba(60,207,122,.15);color:var(--ok)}
.pill.warn{background:rgba(242,201,76,.15);color:var(--warn)}
.pill.bad{background:rgba(255,90,90,.15);color:var(--bad)}
.bar{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(24,26,31,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:9px 0 10px;color:var(--muted);cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.ad{border:1px dashed #4a4f5a;border-radius:var(--radius);padding:12px;margin-bottom:12px;display:flex;gap:12px;align-items:center;background:#191b20}
.ad .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input.i,select.i,textarea.i{display:block;width:100%;max-width:100%;min-width:0;min-height:44px;-webkit-appearance:none;appearance:none;font-size:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent)}
textarea.i{min-height:70px;resize:vertical}
.attl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.att{width:76px;height:76px;border-radius:10px;background:var(--panel2) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;overflow:hidden;cursor:pointer;border:1px solid var(--line);padding:4px;word-break:break-all}
.att .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);border:0;color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.pill.prev{background:rgba(120,140,255,.15);color:#a9b5ff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin-bottom:12px}.kv b{color:var(--muted);font-weight:500}
input.i[type=date],input.i[type=month]{text-align:left}
input.i::-webkit-date-and-time-value{text-align:left}
select.i{background-image:linear-gradient(45deg,transparent 50%,#9aa1ad 50%),linear-gradient(135deg,#9aa1ad 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
label.f>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
fieldset{min-width:0}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px 2px;margin:0 0 12px}
legend{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;padding:0 6px;color:var(--accent2)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet h3{font-size:22px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:flex;background:var(--panel2);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);color:#1a1205}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
.empty{text-align:center;padding:30px 10px}
.empty .e{font-size:46px}
.legal{font-size:13px;line-height:1.55;color:#cfd3da}
.legal h4{margin:14px 0 4px;font-size:14px}
.cat-bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.cat-bar .n{width:110px;flex:0 0 110px}
.cat-bar .b{flex:1;height:10px;background:var(--panel2);border-radius:9px;overflow:hidden}
.cat-bar .b i{display:block;height:100%;background:var(--accent)}
.cat-bar .v{width:80px;text-align:right}
.badge-pro{font-size:11px;background:linear-gradient(90deg,#ff8a1f,#ffcf5c);color:#1a1205;border-radius:6px;padding:1px 6px;font-weight:700;margin-left:6px}
.warnbox{background:rgba(242,201,76,.1);border:1px solid rgba(242,201,76,.35);border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
pre.code{white-space:pre-wrap;word-break:break-all;background:#0e0f12;border-radius:10px;padding:10px;font-size:11px;max-height:220px;overflow:auto}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff8a1f" stroke-width="2.2" stroke-linecap="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span class="lt">Service<span>heft</span></span></div>
    <div class="vsel" id="vsel"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>

<script>
/* =========================================================
   KONFIGURATION – hier später echte Partner-/Affiliate-Daten eintragen
   ========================================================= */
const CONFIG = {
  freeVehicles: 1,
  communityMin: 1, // Mindestanzahl Fahrer, ab der ein Community-Wert angezeigt wird (Live-Betrieb: 3+)
  pricing: { monthly: "2,99 €", yearly: "19,99 €", extraVehicle: "0,99 €/Monat" },
  partners: [
    { id:"amazon",   name:"Amazon",     types:["auto","motorrad"], url:q=>`https://www.amazon.de/s?k=${q}&tag=DEIN-AFFILIATE-TAG-21` },
    { id:"autodoc",  name:"Autodoc",    types:["auto"],            url:q=>`https://www.autodoc.de/search?keyword=${q}` },
    { id:"kfzteile", name:"kfzteile24", types:["auto"],            url:q=>`https://www.kfzteile24.de/suche?search=${q}` },
    { id:"louis",    name:"Louis",      types:["motorrad"],        url:q=>`https://www.louis.de/search?q=${q}` },
    { id:"ebay",     name:"eBay",       types:["auto","motorrad"], url:q=>`https://www.ebay.de/sch/i.html?_nkw=${q}` }
  ],
  ads: [
    { t:"Motoröl-Woche: bis zu 25 % Rabatt", s:"Partner-Anzeige · Platzhalter", e:"🛢️" },
    { t:"Werkstattbedarf für Selbstschrauber", s:"Partner-Anzeige · Platzhalter", e:"🔧" },
    { t:"Drehmomentschlüssel & Werkstattwagen", s:"Partner-Anzeige · Platzhalter", e:"🧰" }
  ]
};

const CATS = {
  service:{n:"Inspektion/Service",e:"🛠️"}, repair:{n:"Reparatur",e:"🔩"}, damage:{n:"Unfall/Schaden",e:"💥"}, parts:{n:"Teile/Umbau",e:"⚙️"},
  fuel:{n:"Tanken/Laden",e:"⛽"}, tires:{n:"Reifen",e:"🛞"}, hu:{n:"HU/AU (TÜV)",e:"📋"},
  fees:{n:"Versicherung/Steuer",e:"💶"}, care:{n:"Pflege",e:"🧽"}, other:{n:"Sonstiges",e:"📎"}
};
const PRESETS = {
  auto:[
    {name:"Ölwechsel + Ölfilter",km:15000,mo:12},{name:"Luftfilter",km:30000,mo:24},{name:"Innenraumfilter",km:15000,mo:12},
    {name:"Bremsflüssigkeit",km:0,mo:24},{name:"Zündkerzen",km:60000,mo:48},{name:"Zahnriemen",km:120000,mo:72},
    {name:"Kühlmittel",km:0,mo:48},{name:"HU/AU (TÜV)",km:0,mo:24}
  ],
  motorrad:[
    {name:"Ölwechsel + Ölfilter",km:6000,mo:12},{name:"Kette reinigen/schmieren",km:600,mo:0},{name:"Kettensatz prüfen",km:6000,mo:12},
    {name:"Bremsflüssigkeit",km:0,mo:24},{name:"Ventilspiel prüfen",km:24000,mo:0},{name:"Luftfilter",km:12000,mo:24},
    {name:"Zündkerzen",km:12000,mo:24},{name:"Kühlmittel",km:0,mo:36},{name:"HU (TÜV)",km:0,mo:24}
  ]
};
const PART_SUGGEST = {
  auto:["Ölfilter","Motoröl","Luftfilter","Innenraumfilter","Bremsbeläge vorne","Bremsscheiben","Zündkerzen","Wischerblätter","Batterie","Zahnriemensatz"],
  motorrad:["Ölfilter","Motoröl","Kettensatz","Kettenspray","Bremsbeläge","Luftfilter","Zündkerzen","Batterie","Reifen","Bremsflüssigkeit DOT 4"]
};

/* ================= State & Speicherung ================= */
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0,10);
let S = { meta:{premium:false,consentShare:false,consentCommunity:false,consentDate:null,activeId:null,cart:[],adsSeen:0}, vehicles:{} };
let UI = { tab:"home", filter:"all" };
let store = { mode:"local", db:null, uid:null, dirty:new Set(), timer:null, busy:false };
let downloads = null;
let COMM = { loaded:false, groups:{} };
const SRC={handbuch:"📕 Handbuch/Serviceplan",werkstatt:"🏭 Angabe Werkstatt",eigene:"🔧 Eigene Erfahrung",vorlage:"📄 Vorlage (Richtwert)",community:"👥 Community"};
const SHARE_SRC=["handbuch","werkstatt","eigene"];

function lsGet(){ try{ return JSON.parse(localStorage.getItem("serviceheft_v1")||"null"); }catch(e){ return null; } }
function lsSet(){ try{ localStorage.setItem("serviceheft_v1", JSON.stringify(S)); }catch(e){} }

function markDirty(key){ store.dirty.add(key); lsSet(); clearTimeout(store.timer); store.timer=setTimeout(flush,700); }
async function flush(){
  if(!store.db||!store.uid||store.busy) return;
  store.busy=true;
  try{
    while(store.dirty.size){
      const key=[...store.dirty][0]; store.dirty.delete(key);
      const ref=store.db.collection("data/users/"+store.uid).doc(key);
      try{
        if(key==="community"){ const cref=store.db.doc("community/"+store.uid); const pl=communityPayload(); if(pl) await cref.set(pl); else await cref.delete(); continue; }
        if(key==="meta") await ref.set(JSON.parse(JSON.stringify(S.meta)));
        else if(S.vehicles[key.slice(2)]) await ref.set(JSON.parse(JSON.stringify(S.vehicles[key.slice(2)])));
        else await ref.delete();
      }catch(e){
        if(e&&e.code==="quota_exceeded"){ toast("Speicher voll – bitte alte Einträge exportieren/löschen"); }
        else if(e&&e.code==="unavailable"){ store.dirty.add(key); await new Promise(r=>setTimeout(r,1500+Math.random()*1000)); }
        else { store.mode="local"; break; }
      }
    }
  } finally { store.busy=false; }
  renderStorageNote();
}
function saveMeta(){ markDirty("meta"); }
function saveVeh(id){ markDirty("v_"+id); if(S.meta.consentCommunity) markDirty("community"); }

async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
    downloads=dl||null;
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    store.db=db; store.uid=id;
    const timer=setTimeout(()=>toast("Cloud-Speicher antwortet nicht – lokal gespeichert"),10000);
    const snap=await db.collection("data/users/"+id).get();
    clearTimeout(timer);
    store.mode="cloud";
    if(snap.size){
      const fresh={meta:{...S.meta},vehicles:{}};
      snap.docs.forEach(d=>{
        const v=d.data(); if(!v) return;
        if(d.id==="meta") fresh.meta={...fresh.meta,...JSON.parse(JSON.stringify(v))};
        else if(d.id.startsWith("v_")) fresh.vehicles[d.id.slice(2)]=JSON.parse(JSON.stringify(v));
      });
      S=fresh; lsSet();
    } else if(Object.keys(S.vehicles).length){
      Object.keys(S.vehicles).forEach(k=>store.dirty.add("v_"+k)); store.dirty.add("meta"); flush();
    }
    render();
    loadCommunity();
  }catch(e){ /* bleibt lokal */ }
}

/* ================= Belege & Fotos (IndexedDB, nur auf dem Gerät) ================= */
const FILES={_db:null,ok:true,
  open(){ if(this._db) return this._db; this._db=new Promise((res,rej)=>{ try{ const r=indexedDB.open("serviceheft_files",1); r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); this._db.catch(()=>{this.ok=false;}); return this._db; },
  async tx(mode,fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction("files",mode); const st=t.objectStore("files"); let out; const r=fn(st); if(r) r.onsuccess=()=>{out=r.result;}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  put(o){ return this.tx("readwrite",st=>st.put(o)); },
  get(id){ return this.tx("readonly",st=>st.get(id)); },
  del(id){ return this.tx("readwrite",st=>st.delete(id)); },
  clear(){ return this.tx("readwrite",st=>st.clear()); }
};
const MAX_PDF=8*1024*1024;
function readAsDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(f); }); }
async function fileToAttachment(f){
  const id="f_"+uid();
  if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){ if(f.size>MAX_PDF) throw new Error("PDF zu groß (max. 8 MB)"); return {id,name:f.name,type:"application/pdf",data:await readAsDataURL(f)}; }
  if(!f.type.startsWith("image/")) throw new Error("Nur Fotos und PDFs möglich");
  const url=await readAsDataURL(f);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Bild nicht lesbar")); i.src=url; });
  const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return {id,name:(f.name||"Foto").replace(/\.[^.]+$/,"")+".jpg",type:"image/jpeg",data:cv.toDataURL("image/jpeg",0.82)};
}
async function dataURLtoBlobURL(d){ const b=await (await fetch(d)).blob(); return URL.createObjectURL(b); }
async function allFilesFor(vehicles){
  const out=[]; for(const v of vehicles){ const ids=[...(v.docs||[]).map(a=>a.id),...(v.entries||[]).flatMap(e=>(e.att||[]).map(a=>a.id))]; for(const id of ids){ try{ const f=await FILES.get(id); if(f) out.push(f); }catch(err){} } }
  return out;
}
async function viewAttachment(meta){
  let f=null; try{ f=await FILES.get(meta.id); }catch(e){}
  if(!f){ toast("Datei nicht auf diesem Gerät gefunden"); return; }
  const url=await dataURLtoBlobURL(f.data);
  const prev=$("#overlay").innerHTML;
  const wrap=document.createElement("div"); wrap.className="sheet-bg"; wrap.style.zIndex=25;
  wrap.innerHTML=`<div class="sheet"><h3>${esc(f.name)}<button class="x">×</button></h3>${f.type.startsWith("image/")?`<img src="${url}" style="width:100%;border-radius:10px">`:`<p>PDF-Dokument</p><a class="btn primary block" href="${url}" target="_blank" rel="noopener">PDF öffnen</a>`}</div>`;

/* ================= Community-Intervalle ================= */
const slug=x=>String(x||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"");
function mkey(v){ return [v.typ,slug(v.marke),slug(v.modell),slug(v.kraftstoff)].join("_"); }
function communityPayload(){
  if(!S.meta.consentCommunity) return null;
  const vehicles=vList().map(v=>({key:mkey(v),typ:v.typ,marke:v.marke||"",modell:v.modell||"",baujahr:v.baujahr||"",kraftstoff:v.kraftstoff||"",
    intervals:(v.intervals||[]).filter(i=>SHARE_SRC.includes(i.src)).map(i=>({name:i.name,km:Number(i.km)||0,mo:Number(i.mo)||0,src:i.src}))}))
    .filter(x=>x.intervals.length&&x.marke&&x.modell);
  return vehicles.length?{updated:Date.now(),vehicles}:null;
}
const median=a=>{a=a.filter(x=>x>0).sort((x,y)=>x-y);if(!a.length)return 0;const m=Math.floor(a.length/2);return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2);};
async function loadCommunity(){
  if(!store.db) return;
  try{
    const snap=await store.db.collection("community").get();
    const g={};
    snap.docs.forEach(d=>{const body=d.data(); if(!body||!Array.isArray(body.vehicles)) return;
      body.vehicles.forEach(veh=>{ if(!veh||!veh.key||!Array.isArray(veh.intervals)) return;
        const grp=g[veh.key]=g[veh.key]||{marke:veh.marke,modell:veh.modell,users:new Set(),years:[],items:{}};
        grp.users.add(d.id); if(veh.baujahr) grp.years.push(Number(veh.baujahr));
        veh.intervals.slice(0,40).forEach(iv=>{ const n=String(iv.name||"").trim().slice(0,60); if(!n) return; const k=n.toLowerCase();
          const it=grp.items[k]=grp.items[k]||{name:n,km:[],mo:[],users:new Set(),hb:0};
          if(it.users.has(d.id)) return; it.users.add(d.id); it.km.push(Number(iv.km)||0); it.mo.push(Number(iv.mo)||0); if(iv.src==="handbuch") it.hb++; });
      });
    });
    COMM={loaded:true,groups:g}; if(UI.tab==="int") render();
  }catch(e){ COMM.loaded=true; }
}
function communityFor(v){
  const g=COMM.groups[mkey(v)]; if(!g) return null;
  const items=Object.values(g.items).filter(it=>it.users.size>=CONFIG.communityMin)
    .map(it=>({name:it.name,km:median(it.km),mo:median(it.mo),n:it.users.size,hb:it.hb})).filter(it=>it.km||it.mo)
    .sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
  if(!items.length) return null;
  const ys=g.years.filter(Boolean); return {users:g.users.size,items,years:ys.length?[Math.min(...ys),Math.max(...ys)]:null};
}
function adoptCommunity(v,items){
  v.intervals=v.intervals||[]; let n=0;
  items.forEach(it=>{ const ex=v.intervals.find(i=>i.name.trim().toLowerCase()===it.name.toLowerCase());
    if(ex){ if(ex.src==="vorlage"||!ex.src){ ex.km=it.km; ex.mo=it.mo; ex.src="community"; n++; } }
    else { v.intervals.push({id:uid(),name:it.name,km:it.km,mo:it.mo,lastKm:curKm(v),lastDate:v.kaufdatum||today(),src:"community"}); n++; } });
  saveVeh(v.id); render(); toast(n?`${n} Community-Wert${n===1?"":"e"} übernommen`:"Schon alles vorhanden (eigene Werte bleiben unverändert)");
}
function communityCard(v){
  const c=communityFor(v);
  if(!store.db) return `<div class="card small muted">👥 Community-Werte kommen mit der Online-Version (eigene Datenbank). In dieser Testversion bleiben deine Daten nur auf deinem Gerät.</div>`;
  if(!COMM.loaded) return `<div class="card small muted">👥 Community-Werte werden geladen …</div>`;
  if(!c) return `<div class="card small muted">👥 Für ${esc(vName(v))} (${esc(v.kraftstoff||"")}) gibt es noch keine Community-Werte.${S.meta.consentCommunity?"":` Teile deine Werte aus dem Handbuch und hilf anderen Fahrern – <a href="#" data-act="gotoMore" style="color:var(--accent2)">Teilen aktivieren</a>.`}</div>`;
  return `<div class="card"><h2>👥 Community-Werte <span class="pill r">${c.users} Fahrer</span></h2>
    <div class="small muted" style="margin-bottom:6px">${esc(vName(v))} · ${esc(v.kraftstoff||"")}${c.years?` · Baujahre ${c.years[0]}${c.years[1]!==c.years[0]?"–"+c.years[1]:""}`:""} · Median der geteilten Angaben</div>
    <div class="list">${c.items.map((it,i)=>`<div class="item" style="cursor:default"><div class="grow"><b class="ellip">${esc(it.name)}</b><div class="small muted">${[it.km?"alle "+num(it.km)+" km":"",it.mo?"alle "+it.mo+" Mon.":""].filter(Boolean).join(" · ")} · ${it.n}× genannt${it.hb?` · ${it.hb}× laut Handbuch`:""}</div></div><button class="btn sm" data-adopt="${i}">Übernehmen</button></div>`).join("")}</div>

    <p class="small muted" style="margin:8px 0 0">Angaben anderer Nutzer – ohne Gewähr. Eigene Werte (z. B. aus dem Handbuch) werden nicht überschrieben.</p></div>`;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(Number(n)||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const num=n=>(Number(n)||0).toLocaleString("de-DE");
const fdate=d=>d?new Date(d+"T00:00:00").toLocaleDateString("de-DE"):"–";

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function addMonths(d,m){ const x=new Date(d+"T00:00:00"); x.setMonth(x.getMonth()+Number(m)); return x; }
function vName(v){ return [v.marke,v.modell].filter(Boolean).join(" ")||"Fahrzeug"; }
function curKm(v){ return Math.max(Number(v.kmAktuell)||0,...(v.entries||[]).map(e=>Number(e.km)||0)); }
function kmDate(v){ const k=curKm(v); const e=(v.entries||[]).filter(x=>Number(x.km)===k).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
  if(e&&(!v.kmDate||Number(v.kmAktuell)<k||e.date>v.kmDate)) return e.date; return v.kmDate||null; }

function ivStatus(iv,v){
  const km=curKm(v); let kmLeft=null,daysLeft=null,fr=0;
  if(iv.km>0){ const last=Number(iv.lastKm)||0; kmLeft=last+Number(iv.km)-km; fr=Math.max(fr,(km-last)/iv.km); }
  if(iv.mo>0){ const base=iv.lastDate||v.kaufdatum||today(); const due=addMonths(base,iv.mo); daysLeft=Math.round((due-new Date())/864e5); const tot=(due-new Date(base+"T00:00:00"))/864e5; fr=Math.max(fr,1-daysLeft/tot); }
  let st="ok";
  if((kmLeft!==null&&kmLeft<=0)||(daysLeft!==null&&daysLeft<=0)) st="bad";
  else if((kmLeft!==null&&kmLeft<Math.max(500,iv.km*.1))||(daysLeft!==null&&daysLeft<45)) st="warn";
  const parts=[]; if(kmLeft!==null) parts.push(kmLeft<=0?`${num(-kmLeft)} km überfällig`:`noch ${num(kmLeft)} km`);
  if(daysLeft!==null) parts.push(daysLeft<=0?`${-daysLeft} Tage überfällig`:`noch ${daysLeft} Tage`);
  return {st,fr:Math.min(1,Math.max(0,fr)),txt:parts.join(" · ")||"kein Intervall"};
}

/* ================= Sheets / Formulare ================= */
function sheet(title,html,onMount){
  $("#overlay").innerHTML=`<div class="sheet-bg"><div class="sheet"><h3>${title}<button class="x" id="sx">×</button></h3>${html}</div></div>`;
  const bg=$("#overlay .sheet-bg");
  bg.onclick=e=>{if(e.target===bg)close();}; $("#sx").onclick=close;
  onMount&&onMount($("#overlay .sheet"));
}
function close(){ $("#overlay").innerHTML=""; }
function confirmSheet(msg,yes){
  sheet("Bestätigen",`<p>${esc(msg)}</p><div class="row"><button class="btn grow" id="cn">Abbrechen</button><button class="btn danger grow" id="cy">Ja, löschen</button></div>`,()=>{$("#cn").onclick=close;$("#cy").onclick=()=>{close();yes();};});
}
function field(name,label,val,type="text",extra=""){
  return `<label class="f"><span>${label}</span><input class="i" name="${name}" type="${type}" value="${esc(val??"")}" ${extra}></label>`;
}
function sel(name,label,val,opts){
  return `<label class="f"><span>${label}</span><select class="i" name="${name}">${opts.map(o=>{const [k,n]=Array.isArray(o)?o:[o,o];return `<option value="${esc(k)}" ${String(val)===String(k)?"selected":""}>${esc(n)}</option>`;}).join("")}</select></label>`;
}
function formData(root){ const o={}; root.querySelectorAll("[name]").forEach(el=>{ if(el.type==="checkbox") o[el.name]=el.checked; else o[el.name]=el.value.trim(); }); return o; }

function newVehicle(){
  if(!S.meta.premium&&vList().length>=CONFIG.freeVehicles){ premiumSheet("Dein erstes Fahrzeug ist gratis. Für weitere Fahrzeuge brauchst du Premium."); return; }
  vehicleForm(null);

  });

function entryForm(e,cat,partsText){
  const v=V(), isNew=!e||!e.id; e=e||{cat:cat||"service",date:today(),km:curKm(v),by:"self",parts:partsText||""};
  const ivs=v.intervals||[];
  if(e.prev) return entryView(e);
  if(isNew) e={...e,km:""};

function csvCell(x){ x=String(x??""); return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }
function buildCSV(){
  const rows=[["Fahrzeug","FIN","Datum","km","Kategorie","Titel","Kosten","Durchgeführt","Werkstatt","Liter","Teile","Notiz"]];
  vList().forEach(v=>(v.entries||[]).forEach(e=>rows.push([vName(v),v.vin,e.date,e.km,CATS[e.cat]?.n,e.title,String(e.cost).replace(".",","),{self:"Selbst",rent:"Selbst (Mietwerkstatt)",shop:"Werkstatt",dealer:"Vertragshändler"}[e.by],e.workshop,e.liter||"",e.parts,e.note])));
  return "﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\n");
}

  const dmg=all.filter(e=>e.cat==="damage"), svc=all.filter(e=>!["fuel","damage","fees"].includes(e.cat)), fuel=all.filter(e=>e.cat==="fuel");
  const sum=svc.reduce((s,e)=>s+(Number(e.cost)||0),0);
  let transfer="";
  if(opt.transfer){

    veh.entries=(veh.entries||[]).filter(e=>e.cat!=="fees").map(e=>{ if(!opt.costs){e.cost=null; if(e.dmg) e.dmg.hoehe="";} if(!opt.files) e.att=[]; return e; });
    const payload={app:"serviceheft",kind:"transfer",version:1,created:new Date().toISOString(),vehicle:veh,files:opt.files?files:[]};
    transfer=`<script type="application/json" id="serviceheft-transfer">${JSON.stringify(payload).replace(/</g,"\\u003c")}<\/script>`;
  }
  return `<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fahrzeugakte ${esc(vName(v))}</title><style>body{font-family:Arial,sans-serif;max-width:860px;margin:24px auto;padding:0 14px;color:#111;font-size:13px}h1{margin:0}h2{margin:26px 0 6px;font-size:17px;border-bottom:2px solid #ff8a1f;padding-bottom:4px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{background:#f4f4f4}.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-top:12px}.m{color:#666;font-size:11px}.pv{background:#e8ebff;color:#3b4bb3;border-radius:4px;padding:0 4px;font-size:10px}.imgs img{height:90px;border-radius:6px;margin:4px 4px 0 0;border:1px solid #ccc}.pdf{display:inline-block;margin:4px 6px 0 0;font-size:12px}.box{background:#fff7ee;border:1px solid #ffd2a6;border-radius:8px;padding:10px;margin-top:12px}@media print{.imgs img{height:70px}}</style></head><body>
  <h1>Fahrzeugakte / Serviceheft</h1><div class="m">Erstellt am ${new Date().toLocaleDateString("de-DE")} mit der Serviceheft-App · Angaben der Halter, nicht amtlich geprüft</div>
  <div class="g"><div><b>Fahrzeug:</b> ${esc(vName(v))} ${esc(v.variante||"")}</div><div><b>FIN:</b> ${esc(v.vin||"–")}</div><div><b>Erstzulassung:</b> ${fdate(v.ez)}</div><div><b>Baujahr:</b> ${esc(v.baujahr||"–")}</div><div><b>Kennzeichen:</b> ${esc(v.kennzeichen||"–")}</div><div><b>km-Stand:</b> ${num(curKm(v))} km</div><div><b>HSN/TSN:</b> ${esc(v.hsn||"–")}/${esc(v.tsn||"–")}</div><div><b>Antrieb:</b> ${esc(v.kraftstoff||"–")}${v.kw?" · "+v.kw+" kW":""}</div>${opt.costs?`<div><b>Wartung & Reparaturen gesamt:</b> ${eur(sum)}</div>`:""}<div><b>Einträge:</b> ${svc.length} Wartung/Reparatur · ${dmg.length} Schäden</div></div>
  ${opt.transfer?`<div class="box"><b>Übergabe an den neuen Besitzer:</b> Diese Datei enthält die komplette Historie. Mit der Serviceheft-App kann sie unter „Mehr → Export → Daten importieren“ übernommen und weitergeführt werden.</div>`:""}
  <h2>💥 Unfälle & Schäden</h2>
  ${dmg.length?`<table><tr><th>Datum</th><th>km</th><th>Schaden</th><th>Regulierung</th><th>Repariert</th><th>Höhe</th></tr>${dmg.map(e=>{const d=e.dmg||{};return `<tr><td>${fdate(e.date)}</td><td>${num(e.km)}</td><td><b>${esc(e.title||d.art||"Schaden")}</b>${pv(e)}<br><span class="m">${esc(d.art||"")}${d.teile?" · "+esc(d.teile):""}${d.schuld?" · "+esc(SCHULD[d.schuld]||""):""}</span>${e.note?`<br><span class="m">${esc(e.note)}</span>`:""}<div class="imgs">${attHTML(e)}</div></td><td>${esc(d.reg||"–")}${d.vers?"<br>"+esc(d.vers):""}${d.nr?`<br><span class="m">Nr. ${esc(d.nr)}</span>`:""}${d.gutachter?`<br><span class="m">Gutachter: ${esc(d.gutachter)}</span>`:""}</td><td>${{ja:"Ja",teilweise:"Teilweise",nein:"Nein"}[d.repariert]||"–"}</td><td>${money(d.hoehe)}</td></tr>`;}).join("")}</table>`:`<p class="m">Keine Unfälle oder Schäden eingetragen.</p>`}
  <h2>🛠️ Wartung & Reparaturen</h2>
  ${svc.length?`<table><tr><th>Datum</th><th>km</th><th>Arbeit</th><th>Teile</th><th>Durch</th><th>Kosten</th></tr>${svc.map(e=>`<tr><td>${fdate(e.date)}</td><td>${num(e.km)}</td><td><b>${esc(e.title||CATS[e.cat]?.n)}</b>${pv(e)}<br><span class="m">${esc(CATS[e.cat]?.n)}</span>${e.note?`<br><span class="m">${esc(e.note)}</span>`:""}<div class="imgs">${attHTML(e)}</div></td><td>${esc(e.parts||"").replace(/\n/g,"<br>")}</td><td>${byTxt(e)}</td><td>${money(e.cost)}</td></tr>`).join("")}</table>`:`<p class="m">Keine Einträge.</p>`}
  ${fuel.length?`<h2>⛽ km-Nachweis aus Tankstopps</h2><p class="m">${fuel.length} Tankstopps von ${fdate(fuel[0].date)} (${num(fuel[0].km)} km) bis ${fdate(fuel[fuel.length-1].date)} (${num(fuel[fuel.length-1].km)} km).</p>`:""}
  ${transfer}</body></html>`;
}
function buildReportOld(v){
  const es=[...(v.entries||[])].filter(e=>e.cat!=="fuel").sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const c=costs(v);
  return `<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Serviceheft ${esc(vName(v))}</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:30px auto;color:#111;font-size:13px}h1{margin:0}table{width:100%;border-collapse:collapse;margin-top:14px}td,th{border-bottom:1px solid #ccc;padding:6px;text-align:left;vertical-align:top}th{background:#f2f2f2}.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-top:12px}.m{color:#666;font-size:11px}</style></head><body>
  <h1>Serviceheft</h1><div class="m">Erstellt am ${new Date().toLocaleDateString("de-DE")} mit Serviceheft-App · Angaben des Halters, nicht amtlich geprüft</div>
  <div class="g"><div><b>Fahrzeug:</b> ${esc(vName(v))} ${esc(v.variante||"")}</div><div><b>FIN:</b> ${esc(v.vin||"–")}</div><div><b>Erstzulassung:</b> ${fdate(v.ez)}</div><div><b>Baujahr:</b> ${esc(v.baujahr||"–")}</div><div><b>Kennzeichen:</b> ${esc(v.kennzeichen||"–")}</div><div><b>km-Stand:</b> ${num(curKm(v))} km</div><div><b>HSN/TSN:</b> ${esc(v.hsn||"–")}/${esc(v.tsn||"–")}</div><div><b>Wartungskosten gesamt:</b> ${eur(c.total-(c.by.fuel||0))}</div></div>
  <table><tr><th>Datum</th><th>km</th><th>Arbeit</th><th>Teile</th><th>Durch</th><th>Kosten</th></tr>
  ${es.map(e=>`<tr><td>${fdate(e.date)}</td><td>${num(e.km)}</td><td><b>${esc(e.title||CATS[e.cat]?.n)}</b><br><span class="m">${esc(CATS[e.cat]?.n)}</span></td><td>${esc(e.parts||"").replace(/\n/g,"<br>")}</td><td>${e.by==="self"?"Selbst":e.by==="rent"?"Selbst, Mietwerkstatt"+(e.workshop?" "+esc(e.workshop):""):esc(e.workshop||"Werkstatt")}</td><td>${eur(e.cost)}</td></tr>`).join("")}
  </table></body></html>`;
}
async function deliver(filename,data,mime){
  try{
    const type=filename.endsWith(".json")?"application/json":filename.endsWith(".csv")?"text/csv":"text/html";
    const file=new File([data],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return true; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); return true;
  }catch(e){ if(e&&e.name==="AbortError") return false; }
  if(downloads){ try{ await downloads.save({filename,data}); return; }catch(e){ if(e&&/declin|cancel|abort/i.test(e.code||e.message||"")) return; } }
  sheet("Export",`<p class="small muted">Download ist hier nicht verfügbar. Kopiere den Inhalt und speichere ihn als <b>${esc(filename)}</b>.</p><pre class="code">${esc(data.slice(0,20000))}${data.length>20000?"\n…":""}</pre><button class="btn primary block" id="cp">In Zwischenablage kopieren</button>`,()=>{
    $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(data);toast("Kopiert");}catch(e){toast("Kopieren nicht möglich");}};
  });
}
async function backupData(){
  let files=[]; try{ files=await allFilesFor(vList()); }catch(e){}
  return JSON.stringify({app:"serviceheft",version:2,exported:new Date().toISOString(),data:S,files});
}
function fileSafe(v){ return (v.kennzeichen||vName(v)).replace(/[^\wäöüÄÖÜß-]+/g,"-"); }
function transferSheet(){
  const v=V(); if(!v) return toast("Kein Fahrzeug");
  sheet("🔑 Fahrzeug übergeben",`<p class="small muted" style="margin-top:0">Erstellt die komplette Fahrzeugakte von <b style="color:var(--text)">${esc(vName(v))}</b> als eine Datei. Der neue Besitzer kann sie ansehen, ausdrucken – und mit der Serviceheft-App übernehmen und weiterführen.</p>
    <label class="toggle"><input type="checkbox" id="tcost" checked><div><b>Kosten mitgeben</b><div class="small muted">Preise von Reparaturen und Schäden anzeigen</div></div></label>
    <label class="toggle"><input type="checkbox" id="tfiles" checked><div><b>Belege & Fotos mitgeben</b><div class="small muted">Rechnungen, Gutachten, Fotos</div></div></label>
    <p class="small muted">Nicht enthalten: deine Versicherungsdaten, Kaufpreis, private Notizen, Versicherungs-/Steuerbuchungen und deine Fahrzeugdokumente (z. B. Fahrzeugschein – die übergibst du im Original).</p>
    <button class="btn primary block" id="tgo">Fahrzeugakte erstellen</button>`,()=>{
    $("#tgo").onclick=async()=>{ $("#tgo").disabled=true; $("#tgo").textContent="Wird erstellt …";
      const html=await buildReport(v,{costs:$("#tcost").checked,files:$("#tfiles").checked,transfer:true});
      close(); await deliver(`Fahrzeugakte-${fileSafe(v)}.html`,html); };
  });
}
async function doExport(kind){
  if(kind==="transfer") return transferSheet();
  if(kind==="json") return backupNow();
  if(kind==="import") return importSheet();
  if(!S.meta.premium) return premiumSheet("Dieser Export ist Teil von Premium. Deine vollständige Datenkopie (JSON) bleibt immer kostenlos.");
  if(kind==="csv") return deliver(`serviceheft-${today()}.csv`,buildCSV());
  if(kind==="report"){ const v=V(); if(!v) return toast("Kein Fahrzeug"); return deliver(`Serviceheft-${fileSafe(v)}.html`,await buildReport(v,{costs:true,files:true})); }
}
async function backupNow(){
  const ok=await deliver(`serviceheft-backup-${today()}.json`,await backupData());
  if(ok!==false){ S.meta.lastBackup=today(); saveMeta(); render(); toast("Backup erstellt – im Teilen-Menü „In Dateien sichern“ → iCloud Drive wählen"); }
}
function importSheet(){
  sheet("Daten importieren",`<p class="small muted">Wähle ein <b>Backup</b> (.json) oder eine <b>Fahrzeugakte</b> vom Vorbesitzer (.html).</p><input type="file" accept=".json,.html,.htm,application/json,text/html" id="imf" class="i">`,()=>{
    $("#imf").onchange=async e=>{
      try{
        const txt=await e.target.files[0].text(); let j;
        if(/^\s*</.test(txt)){ const doc=new DOMParser().parseFromString(txt,"text/html"); const sc=doc.getElementById("serviceheft-transfer"); if(!sc) throw new Error("Diese Datei enthält keine übertragbare Fahrzeugakte."); j=JSON.parse(sc.textContent); }
        else j=JSON.parse(txt);
        if(j.kind==="transfer") return importTransfer(j);
        const d=j.data||j; if(!d.vehicles) throw new Error("Keine Serviceheft-Daten gefunden.");
        for(const f of (j.files||[])){ try{ await FILES.put(f); }catch(err){} }
        Object.values(d.vehicles).forEach(v=>{ if(v&&v.id){ S.vehicles[v.id]=v; saveVeh(v.id); } });
        if(!S.meta.activeId) S.meta.activeId=Object.keys(S.vehicles)[0]; saveMeta(); close(); render(); toast("Backup wiederhergestellt");
      }catch(err){ toast(err&&err.message&&err.message.length<90?err.message:"Datei konnte nicht gelesen werden"); }
    };
  });
}
async function importTransfer(j){
  if(!S.meta.premium&&vList().length>=CONFIG.freeVehicles){ close(); premiumSheet("Du hast schon ein Fahrzeug angelegt. Für ein weiteres Fahrzeug brauchst du Premium – oder du löschst das bisherige."); return; }
  const src=j.vehicle||{}; const nid=uid(); const idmap={};
  for(const f of (j.files||[])){ const nf="f_"+uid(); idmap[f.id]=nf; try{ await FILES.put({...f,id:nf,vid:nid}); }catch(err){} }
  const v={...src,id:nid,created:Date.now(),kaufdatum:today(),kmKauf:curKm(src),kmAktuell:curKm(src),kmDate:today(),vorbesitzer:(Number(src.vorbesitzer)||0)+1};
  v.entries=(src.entries||[]).map(e=>({...e,id:uid(),prev:true,ivs:[],att:(e.att||[]).filter(a=>idmap[a.id]).map(a=>({...a,id:idmap[a.id]}))}));
  v.intervals=(src.intervals||[]).map(i=>({...i,id:uid()}));
  S.vehicles[nid]=v; S.meta.activeId=nid; saveVeh(nid); saveMeta(); close(); UI.tab="home"; render();
  sheet("🔑 Fahrzeug übernommen",`<p>Die Fahrzeugakte von <b>${esc(vName(v))}</b> mit ${v.entries.length} Einträgen ist jetzt in deiner App. Die Einträge des Vorbesitzers sind markiert und nicht änderbar.</p><p class="small muted">Bitte prüfe Kennzeichen, Kaufdatum und deine Versicherung unter „Fahrzeug bearbeiten“.</p><button class="btn primary block" id="tok">Fahrzeug prüfen</button>`,()=>{$("#tok").onclick=()=>{close();vehicleForm(V());};});
}
function wipeAll(){
  FILES.clear().catch(()=>{});
  Object.keys(S.vehicles).forEach(id=>{ delete S.vehicles[id]; saveVeh(id); });
  S.meta={premium:S.meta.premium,lastBackup:S.meta.lastBackup,consentShare:false,consentCommunity:false,consentDate:null,activeId:null,cart:[]}; saveMeta(); markDirty("community"); UI.tab="home"; render(); toast("Alle Daten gelöscht");
}

  const draft=`<div class="warnbox">⚖️ Entwurf/Platzhalter – vor Veröffentlichung von einer Anwältin / einem Anwalt prüfen lassen.</div>`;

  <h4>3a. Community-Intervalle (Opt-in)</h4>Wenn du es aktivierst, werden Marke, Modell, Baujahr, Antrieb und von dir als Handbuch-/Werkstatt-/Erfahrungswert markierte Wartungsintervalle anderen Nutzern mit gleichem Modell als Median-Vorschlag angezeigt. Keine FIN, kein Kennzeichen, keine Kosten. Widerruf löscht deine geteilten Angaben.
  <h4>4. Werbung & Affiliate-Links</h4>Versicherungsdaten dienen nur deiner eigenen Übersicht; wir vermitteln keine Versicherungen. Links zu Teilehändlern sind gekennzeichnete Affiliate-Links. Personalisierte Werbung nur mit gesonderter Einwilligung.
  <h4>5. Deine Rechte</h4>Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit (kostenloser JSON-Export), Widerspruch, Beschwerde bei einer Aufsichtsbehörde.
  <h4>6. Löschung</h4>„Alle Daten löschen“ entfernt deine Daten sofort aus der App.</div>`;

  sheet(which==="agb"?"AGB":"Datenschutz",which==="agb"?agb:privacy);
